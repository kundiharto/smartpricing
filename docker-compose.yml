# Lingkungan lokal berbasis Docker (alternatif dari PostgreSQL Homebrew).
# Belum diuji di mesin ini karena Docker belum terpasang.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPE_ENVIRONMENT: development
      SPE_DATABASE_URL: postgresql+psycopg://spe_app:spe_app_dev@db:5432/spe_dev
      SPE_MIGRATION_DATABASE_URL: postgresql+psycopg://spe_owner:spe_owner_dev@db:5432/spe_dev
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
