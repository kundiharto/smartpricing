[project]
name = "pricing-engine"
version = "1.0.0"
description = "Smart Pricing Engine — deterministic calculation engine (pure Python, Decimal only)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
